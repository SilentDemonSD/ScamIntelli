apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: redis
spec:
  serviceName: redis-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: scamintelli
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scamintelli
        app.kubernetes.io/component: redis
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - redis
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
          args:
            - --maxmemory
            - "1gb"
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - "60"
            - "1000"
            - --save
            - "300"
            - "100"
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --tcp-backlog
            - "511"
            - --tcp-keepalive
            - "300"
            - --timeout
            - "300"
            - --hz
            - "10"
            - --activedefrag
            - "yes"
            - --bind
            - "0.0.0.0"
            - --requirepass
            - "$(REDIS_PASSWORD)"
            - --masterauth
            - "$(REDIS_PASSWORD)"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scamintelli-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "--no-auth-warning", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "--no-auth-warning", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
        - name: redis-sentinel
          image: redis:7-alpine
          ports:
            - containerPort: 26379
              name: sentinel
          command:
            - sh
            - -c
            - |
              cp /etc/redis-template/sentinel.conf /tmp/sentinel.conf
              sed -i "s/REDIS_PASSWORD_PLACEHOLDER/$REDIS_PASSWORD/g" /tmp/sentinel.conf
              redis-sentinel /tmp/sentinel.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scamintelli-secrets
                  key: REDIS_PASSWORD
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/redis-template
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: sentinel-config
          configMap:
            name: redis-sentinel-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
    - port: 26379
      targetPort: 26379
      name: sentinel
  selector:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: redis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
  namespace: scamintelli
data:
  sentinel.conf: |
    port 26379
    sentinel monitor scamintelli-master redis-0.redis-headless.scamintelli.svc.cluster.local 6379 2
    sentinel down-after-milliseconds scamintelli-master 5000
    sentinel failover-timeout scamintelli-master 10000
    sentinel parallel-syncs scamintelli-master 1
    sentinel auth-pass scamintelli-master REDIS_PASSWORD_PLACEHOLDER
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: scamintelli
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scamintelli
      app.kubernetes.io/component: redis
