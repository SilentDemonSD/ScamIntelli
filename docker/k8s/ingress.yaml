apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scamintelli-ingress
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "300"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "64"
    nginx.ingress.kubernetes.io/load-balance: "ewma"
spec:
  ingressClassName: nginx
  rules:
    - host: scamintelli.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scamintelli-service
                port:
                  number: 80
  tls:
    - hosts:
        - scamintelli.example.com
      secretName: scamintelli-tls
