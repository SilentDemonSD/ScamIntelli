apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scamintelli-api-pdb
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scamintelli
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scamintelli-worker-pdb
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scamintelli
      app.kubernetes.io/component: worker
