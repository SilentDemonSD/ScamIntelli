apiVersion: v1
kind: ConfigMap
metadata:
  name: scamintelli-config
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
data:
  LOG_LEVEL: "INFO"
  USE_REDIS: "true"
  REDIS_URL: "redis://redis-0.redis-headless.scamintelli.svc.cluster.local:6379"
  REDIS_SENTINEL_ENABLED: "true"
  REDIS_SENTINEL_HOSTS: "redis-0.redis-headless:26379,redis-1.redis-headless:26379,redis-2.redis-headless:26379"
  REDIS_SENTINEL_MASTER: "scamintelli-master"
  REDIS_POOL_MIN: "10"
  REDIS_POOL_MAX: "100"
  SESSION_TIMEOUT_SECONDS: "3600"
  MAX_ENGAGEMENT_TURNS: "15"
  SCAM_THRESHOLD: "0.7"
  ENABLE_TAMPER_PROTECTION: "true"
  MAX_CONCURRENT_SESSIONS: "5000"
  RATE_LIMIT_PER_MINUTE: "300"
  DISTRIBUTED_LOCK_TTL: "30"
  TASK_QUEUE_STREAM: "scamintelli:tasks"
  TASK_QUEUE_DLQ_STREAM: "scamintelli:dlq"
  TASK_QUEUE_MAX_RETRIES: "3"
  WORKER_CONCURRENCY: "4"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "30"
  BACKPRESSURE_MAX_QUEUE_DEPTH: "32"
  BACKPRESSURE_SHED_THRESHOLD: "0.85"
  BACKPRESSURE_SLOWDOWN_THRESHOLD: "0.7"
  GUNICORN_WORKERS: "4"
  GUNICORN_MAX_REQUESTS: "2000"
  GUNICORN_MAX_REQUESTS_JITTER: "200"
  GUNICORN_TIMEOUT: "30"
  GUNICORN_KEEPALIVE: "5"
  GRAPH_CACHE_TTL: "300"
  GRAPH_BATCH_INTERVAL: "60"
  GRAPH_COMPUTATION_TIMEOUT: "30"
  NEO4J_ENABLED: "false"
  NEO4J_URI: "bolt://neo4j.scamintelli.svc.cluster.local:7687"
  NEO4J_USER: "neo4j"
  NEO4J_MAX_POOL_SIZE: "50"
  NEO4J_CONNECTION_TIMEOUT: "5.0"
  PYTHONPATH: "/app"
  PYTHONUNBUFFERED: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: scamintelli-secrets
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
type: Opaque
stringData:
  API_KEY: "REPLACE_WITH_API_KEY"
  GEMINI_API_KEY: "REPLACE_WITH_GEMINI_KEY"
  GUVI_CALLBACK_URL: "REPLACE_WITH_CALLBACK_URL"
  NEO4J_PASSWORD: "REPLACE_WITH_NEO4J_PASSWORD"
  REDIS_PASSWORD: "REPLACE_WITH_REDIS_PASSWORD"
