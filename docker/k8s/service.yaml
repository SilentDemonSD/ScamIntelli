apiVersion: v1
kind: Service
metadata:
  name: scamintelli-service
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: scamintelli
  labels:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: scamintelli
    app.kubernetes.io/component: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
    - port: 26379
      targetPort: 26379
      protocol: TCP
      name: sentinel
