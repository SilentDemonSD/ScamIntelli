services:
  nginx:
    image: nginx:1.27-alpine
    container_name: scamintelli-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 96M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - scamintelli
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8000"
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - LOG_LEVEL=WARNING
      - SESSION_TIMEOUT_SECONDS=3600
      - MAX_ENGAGEMENT_TURNS=15
      - SCAM_THRESHOLD=0.7
      - DEBUG_MODE=false
      - ENABLE_TAMPER_PROTECTION=true
      - GUNICORN_WORKERS=2
      - GUNICORN_MAX_REQUESTS=2000
      - GUNICORN_MAX_REQUESTS_JITTER=200
      - GUNICORN_TIMEOUT=30
      - GUNICORN_KEEPALIVE=5
      - BACKPRESSURE_MAX_QUEUE_DEPTH=500
      - CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
      - CIRCUIT_BREAKER_RECOVERY_TIMEOUT=30
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-scamintelli}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - app_sessions:/app/sessions
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.70"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 384M
    networks:
      - scamintelli
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "src.task_queue.workers"]
    env_file:
      - ../.env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - USE_REDIS=true
      - LOG_LEVEL=WARNING
      - WORKER_CONCURRENCY=4
      - TASK_QUEUE_MAX_RETRIES=3
      - NEO4J_ENABLED=${NEO4J_ENABLED:-false}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-scamintelli}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.35"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 192M
    networks:
      - scamintelli
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: scamintelli-redis
    command: >
      redis-server
      --maxmemory 384mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 100
      --appendonly yes
      --appendfsync everysec
      --tcp-backlog 511
      --tcp-keepalive 300
      --timeout 300
      --hz 10
      --lfu-log-factor 10
      --activedefrag yes
      --bind 0.0.0.0
      --protected-mode no
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 640M
        reservations:
          cpus: "0.10"
          memory: 192M
    networks:
      - scamintelli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  neo4j:
    image: neo4j:5-community
    container_name: scamintelli-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-scamintelli}
      - NEO4J_PLUGINS=[]
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
      - NEO4J_server_jvm_additional=-XX:+UseG1GC -XX:+ParallelRefProcEnabled
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    expose:
      - "7474"
      - "7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 1280M
        reservations:
          cpus: "0.10"
          memory: 512M
    networks:
      - scamintelli
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    profiles:
      - neo4j

volumes:
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  app_sessions:
    driver: local
  neo4j_data:
    driver: local

networks:
  scamintelli:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
