<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScamIntelli - Detection Explainability Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 20px 40px;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00d4ff; font-size: 24px; }
        .header .session-info { font-size: 14px; color: #8892b0; }
        .risk-badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
        }
        .risk-critical { background: #ff0040; color: #fff; }
        .risk-high { background: #ff6b00; color: #fff; }
        .risk-medium { background: #ffc107; color: #000; }
        .risk-low { background: #4caf50; color: #fff; }
        .risk-minimal { background: #607d8b; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; margin-top: 20px; }
        .card {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); border-color: #0f3460; }
        .card h3 { color: #00d4ff; margin-bottom: 15px; font-size: 16px; }
        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a4a; }
        .stat-label { color: #8892b0; }
        .stat-value { color: #e0e0e0; font-weight: 600; }
        .chart-container { position: relative; height: 280px; margin-top: 10px; }
        .signal-bar {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }
        .signal-name { width: 140px; font-size: 13px; color: #8892b0; }
        .signal-fill-bg {
            flex: 1;
            height: 24px;
            background: #2a2a4a;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .signal-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease;
        }
        .signal-value {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            font-weight: 600;
            color: #fff;
        }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
        }
        .tag-risk { background: rgba(255, 0, 64, 0.2); color: #ff4d6d; border: 1px solid rgba(255, 0, 64, 0.3); }
        .tag-psych { background: rgba(156, 39, 176, 0.2); color: #ce93d8; border: 1px solid rgba(156, 39, 176, 0.3); }
        .tag-layer { background: rgba(0, 212, 255, 0.15); color: #00d4ff; border: 1px solid rgba(0, 212, 255, 0.25); }
        .summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .summary-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
        }
        .summary-card .value { font-size: 32px; font-weight: 700; color: #00d4ff; }
        .summary-card .label { font-size: 12px; color: #8892b0; margin-top: 4px; }
        .full-width { grid-column: 1 / -1; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: 1fr; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <h1>ScamIntelli Explainability Dashboard</h1>
            <div class="session-info" id="session-info"></div>
        </div>
        <div id="risk-badge"></div>
    </div>

    <div class="container">
        <div class="summary-grid" id="summary-grid"></div>
        <div class="grid">
            <div class="card">
                <h3>Detection Layer Breakdown</h3>
                <div class="chart-container"><canvas id="layerChart"></canvas></div>
            </div>
            <div class="card">
                <h3>Score Radar</h3>
                <div class="chart-container"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="card">
                <h3>Signal Strength Analysis</h3>
                <div id="signal-bars"></div>
            </div>
            <div class="card">
                <h3>Psychological Tactics & Risk Factors</h3>
                <div style="margin-bottom: 15px">
                    <h4 style="color: #ff4d6d; font-size: 13px; margin-bottom: 8px;">Risk Factors</h4>
                    <div id="risk-factors"></div>
                </div>
                <div>
                    <h4 style="color: #ce93d8; font-size: 13px; margin-bottom: 8px;">Psychological Tactics</h4>
                    <div id="psych-tactics"></div>
                </div>
            </div>
            <div class="card full-width">
                <h3>Advanced Feature Heatmap</h3>
                <div class="chart-container" style="height: 350px;"><canvas id="advancedChart"></canvas></div>
            </div>
            <div class="card">
                <h3>Detection Layers Used</h3>
                <div id="layers-used"></div>
            </div>
            <div class="card">
                <h3>Session Details</h3>
                <div id="session-details"></div>
            </div>
        </div>
    </div>

    <script>
        const detectionDetails = JSON.parse('{{DETECTION_DETAILS}}' || '{}');
        const sessionData = JSON.parse('{{SESSION_DATA}}' || '{}');

        const riskColors = {
            critical: '#ff0040', high: '#ff6b00', medium: '#ffc107',
            low: '#4caf50', minimal: '#607d8b'
        };

        function init() {
            const dr = detectionDetails.detection_result || {};
            const riskLevel = dr.risk_level || 'minimal';

            document.getElementById('session-info').textContent =
                `Session: ${sessionData.session_id || 'N/A'} | Category: ${sessionData.scam_category || 'Unknown'}`;

            const badge = document.getElementById('risk-badge');
            badge.className = `risk-badge risk-${riskLevel}`;
            badge.textContent = `${riskLevel} risk`;

            renderSummary(dr);
            renderLayerChart();
            renderRadarChart();
            renderSignalBars();
            renderRiskFactors();
            renderAdvancedChart();
            renderLayersUsed();
            renderSessionDetails();
        }

        function renderSummary(dr) {
            const grid = document.getElementById('summary-grid');
            const items = [
                { value: `${((dr.confidence || 0) * 100).toFixed(1)}%`, label: 'Confidence Score' },
                { value: dr.is_scam ? 'YES' : 'NO', label: 'Scam Detected' },
                { value: sessionData.turn_count || 0, label: 'Messages Exchanged' },
                { value: dr.has_hard_indicators ? 'YES' : 'NO', label: 'Hard Indicators' },
            ];
            grid.innerHTML = items.map(i =>
                `<div class="summary-card"><div class="value">${i.value}</div><div class="label">${i.label}</div></div>`
            ).join('');
        }

        function renderLayerChart() {
            const breakdown = detectionDetails.score_breakdown || {};
            const labels = Object.keys(breakdown);
            const values = Object.values(breakdown);
            const colors = labels.map((_, i) => `hsl(${(i * 36) % 360}, 70%, 55%)`);

            new Chart(document.getElementById('layerChart'), {
                type: 'bar',
                data: {
                    labels: labels.map(l => l.replace('_', ' ')),
                    datasets: [{
                        data: values,
                        backgroundColor: colors.map(c => c.replace('55%', '55%, 0.7)')),
                        borderColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 1, ticks: { color: '#8892b0' }, grid: { color: '#2a2a4a' } },
                        x: { ticks: { color: '#8892b0', maxRotation: 45 }, grid: { display: false } }
                    }
                }
            });
        }

        function renderRadarChart() {
            const breakdown = detectionDetails.score_breakdown || {};
            new Chart(document.getElementById('radarChart'), {
                type: 'radar',
                data: {
                    labels: Object.keys(breakdown).map(l => l.replace('_', ' ')),
                    datasets: [{
                        data: Object.values(breakdown),
                        backgroundColor: 'rgba(0, 212, 255, 0.15)',
                        borderColor: '#00d4ff',
                        pointBackgroundColor: '#00d4ff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        r: {
                            beginAtZero: true, max: 1,
                            ticks: { color: '#8892b0', backdropColor: 'transparent' },
                            grid: { color: '#2a2a4a' },
                            pointLabels: { color: '#8892b0', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function renderSignalBars() {
            const signals = detectionDetails.top_signals || [];
            const container = document.getElementById('signal-bars');
            const colors = ['#ff0040', '#ff6b00', '#ffc107', '#4caf50', '#00d4ff'];

            container.innerHTML = signals.map((s, i) => {
                const width = Math.min(s.strength * 100, 100);
                return `<div class="signal-bar">
                    <span class="signal-name">${s.signal.replace('_', ' ')}</span>
                    <div class="signal-fill-bg">
                        <div class="signal-fill" style="width:${width}%; background:${colors[i % colors.length]}"></div>
                        <span class="signal-value">${(s.strength * 100).toFixed(1)}%</span>
                    </div>
                </div>`;
            }).join('');

            if (!signals.length) container.innerHTML = '<div style="color:#607d8b;text-align:center;padding:20px;">No significant signals detected</div>';
        }

        function renderRiskFactors() {
            const risks = detectionDetails.risk_factors || [];
            const psychs = detectionDetails.psychological_tactics || [];

            document.getElementById('risk-factors').innerHTML = risks.length
                ? risks.map(r => `<span class="tag tag-risk">${r}</span>`).join('')
                : '<span style="color:#607d8b">None detected</span>';

            document.getElementById('psych-tactics').innerHTML = psychs.length
                ? psychs.map(p => `<span class="tag tag-psych">${p}</span>`).join('')
                : '<span style="color:#607d8b">None detected</span>';
        }

        function renderAdvancedChart() {
            const features = detectionDetails.advanced_features || {};
            const categories = { temporal: [], linguistic: [], psych: [], behav: [], info: [] };

            for (const [key, val] of Object.entries(features)) {
                const prefix = key.split('_')[0];
                if (categories[prefix]) categories[prefix].push({ name: key, value: val });
            }

            const datasets = [];
            const catColors = { temporal: '#00d4ff', linguistic: '#4caf50', psych: '#ff6b00', behav: '#9c27b0', info: '#ffc107' };
            const allLabels = Object.values(features);
            const allKeys = Object.keys(features);

            Object.entries(categories).forEach(([cat, items]) => {
                const data = new Array(allKeys.length).fill(null);
                items.forEach(item => {
                    const idx = allKeys.indexOf(item.name);
                    if (idx >= 0) data[idx] = item.value;
                });
                datasets.push({
                    label: cat,
                    data: data,
                    backgroundColor: catColors[cat] + '99',
                    borderColor: catColors[cat],
                    borderWidth: 1
                });
            });

            new Chart(document.getElementById('advancedChart'), {
                type: 'bar',
                data: { labels: allKeys.map(k => k.replace(/^[^_]+_/, '')), datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#8892b0' } } },
                    scales: {
                        y: { beginAtZero: true, max: 1, ticks: { color: '#8892b0' }, grid: { color: '#2a2a4a' } },
                        x: { ticks: { color: '#8892b0', maxRotation: 90, font: { size: 9 } }, grid: { display: false } }
                    }
                }
            });
        }

        function renderLayersUsed() {
            const layers = detectionDetails.detection_layers_used || [];
            document.getElementById('layers-used').innerHTML = layers.length
                ? layers.map(l => `<span class="tag tag-layer">${l}</span>`).join('')
                : '<span style="color:#607d8b">No layers</span>';
        }

        function renderSessionDetails() {
            const container = document.getElementById('session-details');
            const rows = [
                ['Session ID', sessionData.session_id],
                ['Scam Detected', sessionData.scam_detected ? 'Yes' : 'No'],
                ['Scam Category', sessionData.scam_category || 'Unknown'],
                ['Persona Type', sessionData.persona_type || 'N/A'],
                ['Messages', sessionData.turn_count],
                ['Engagement', sessionData.engagement_active ? 'Active' : 'Ended'],
                ['Confidence', ((sessionData.confidence_level || 0) * 100).toFixed(1) + '%'],
            ];
            container.innerHTML = rows.map(([k, v]) =>
                `<div class="stat-row"><span class="stat-label">${k}</span><span class="stat-value">${v}</span></div>`
            ).join('');
        }

        init();
    </script>
</body>
</html>
